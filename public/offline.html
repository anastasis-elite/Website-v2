<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0908">
    <title>Reconnect to Anastasis</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0908; color: #f6f2ea; font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 28rem; margin: 2rem; }
      h1 { font-size: 1.7rem; line-height: 1.3; }
      p { color: #d5cbbc; }
      a { display: inline-block; padding: .7rem 1.2rem; background: #f1d49d; border-radius: .5rem; color: #0b0908; text-decoration: none; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Reconnect to load your dashboard</h1>
      <p>Anastasis couldn't reach the server. Reconnect, then try again.</p>
      <p>Activity drafts saved on this device are kept. Keep any open activity screen until your connection returns.</p>
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
